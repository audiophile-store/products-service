name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TEST_DATABASE_URL: postgresql://products:ci_password@localhost:5432/products_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: products
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: products_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U products -d products_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply test database migration
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec -i "$POSTGRES_CONTAINER"
          psql -U products -d products_test -v ON_ERROR_STOP=1
          < migrations/001_create_products.sql

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
